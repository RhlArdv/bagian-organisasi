# Reject any request with an unrecognized Host header.
# This prevents Host Header Injection (WEB-679752 / CWE-20) at the Nginx level.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;  # Drop the connection immediately — no response
}

server {
    listen 80;
    server_name bagian-organisasi.sv.padang.go.id bagorganisasi.padang.go.id www.bagian-organisasi.sv.padang.go.id localhost 127.0.0.1 103.141.74.157;
    server_tokens off;                      # sembunyikan versi nginx (WEB-868553)

    # Blok metode berbahaya & anti request-smuggling header
    if ($request_method ~ ^(TRACE|TRACK)$) { return 405; }
    if ($http_x_original_url) { return 403; }
    if ($http_x_rewrite_url)  { return 403; }

    root /var/www/public;
    index index.php index.html;
    charset utf-8;
    access_log off;
    error_log /var/log/nginx/error.log error;

    # Izinkan upload file hingga 20MB (mencegah error 413 Request Entity Too Large)
    client_max_body_size 20M;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    # Serve uploaded files directly from the storage volume.
    location /storage/ {
        alias /var/www/storage/app/public/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.php$ {
        fastcgi_pass bagian-organisasi_app:9000;       # container_name unik (cegah bentrok global-gateway)
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;    # sembunyikan versi PHP
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    location ~ /\.(?!well-known).* { deny all; }   # sembunyikan dotfile kecuali .well-known
}
